# busmon.cfg - sample the floppy bus inputs over SWD and log every change.
# Usage: openocd -f interface/stlink.cfg -f target/artery/at32f4x.cfg -f ../tools/busmon.cfg
# Writes build/busmon.txt: "<ms> SEL STEP DIR SIDE1 WGATE" (1 = asserted/low)
init
set fp [open "build/busmon.txt" w]
set t0 [ms]
set last ""
set n 0
while {[expr {[ms] - $t0}] < 60000} {
  set a [read_memory 0x40010808 32 1]
  set b [read_memory 0x40010C08 32 1]
  set sel   [expr {($a & 0x0001) == 0}]
  set step  [expr {($a & 0x0002) == 0}]
  set dir   [expr {($b & 0x0001) == 0}]
  set side  [expr {($b & 0x0010) == 0}]
  set wgate [expr {($b & 0x0200) == 0}]
  set cur "$sel $step $dir $side $wgate"
  incr n
  if {$cur ne $last} { puts $fp "[expr {[ms] - $t0}] $cur"; set last $cur }
}
puts $fp "samples $n in [expr {[ms] - $t0}] ms"
close $fp
exit
